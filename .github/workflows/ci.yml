name: CI

on:
  push:
    branches: [ main ]
    paths: ['backend/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [ main ]
    paths: ['backend/**', '.github/workflows/ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Smoke test (import do app)
        run: python -c "from app.main import app; print('app importado com sucesso')"

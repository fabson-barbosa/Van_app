name: Mobile CI

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']

defaults:
  run:
    working-directory: mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

# Sem `lint`: o mobile/package.json não tem esse script (o apps/web tem).
# Sem `build`: um app Expo não tem equivalente de CI ao `next build` — o que
# existiria é `eas build`, que precisa de conta e credenciais do usuário.
# Sem `expo-doctor`: depende de alcançar a API do Expo e o React Native
# Directory, o que torna o job dependente de rede externa sem verificar nada
# que `tsc` + `jest` já não cubram.
